name: Build branch Docker images
run-name: Build Docker images from ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Repository branch to build (images are tagged with its full commit SHA)
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: build-branch-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve branch commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate branch name
        env:
          BUILD_BRANCH: ${{ inputs.branch }}
        run: git check-ref-format "refs/heads/${BUILD_BRANCH}"

      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false

      - name: Resolve image tag
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Docker image tag: \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Build ${{ matrix.name }}
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: analysis-cpu
            dockerfile: services/analysis/docker/Dockerfile.cpu
          - name: analysis-gpu
            dockerfile: services/analysis/docker/Dockerfile.gpu
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.name }}
        run: echo "name=ghcr.io/${IMAGE_OWNER,,}/echora-${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and publish commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.source.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}

      - name: Report published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ needs.source.outputs.sha }}
        run: echo "Published \`${IMAGE}:${COMMIT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
