name: Release Navidrome plugin

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Plugin version component to increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-navidrome-plugin
  cancel-in-progress: false

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.plugin-release-tmp
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Plugin releases must be dispatched from the main branch." >&2
          exit 1

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare build scratch directory
        run: mkdir -p "$TMPDIR"

      - name: Increment plugin version
        id: version
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          version="$(python3 .github/scripts/bump-plugin-version.py "$INCREMENT")"
          tag="navidrome-plugin-v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            plugins/navidrome/go.sum
            plugins/navidrome/contract-tests/go.sum

      - name: Install TinyGo
        env:
          TINYGO_VERSION: '0.42.0'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz" \
            --output "$TMPDIR/tinygo.tar.gz"
          tar -xzf "$TMPDIR/tinygo.tar.gz" -C "$TMPDIR"
          echo "$TMPDIR/tinygo/bin" >> "$GITHUB_PATH"

      - name: Test plugin adapter
        working-directory: plugins/navidrome
        run: make test

      - name: Test Navidrome contracts
        working-directory: plugins/navidrome/contract-tests
        run: go test ./...

      - name: Build plugin module and package
        working-directory: plugins/navidrome
        run: make package

      - name: Validate and prepare release artifacts
        working-directory: plugins/navidrome
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile

          package = Path("dist/echora.ndp")
          with zipfile.ZipFile(package) as archive:
              assert sorted(archive.namelist()) == ["manifest.json", "plugin.wasm"], "Invalid package contents"
              assert archive.testzip() is None, "Corrupt package"
              manifest = json.loads(archive.read("manifest.json"))
              assert manifest["id"] == "echora", "Wrong plugin ID"
              assert manifest["version"] == os.environ["PLUGIN_VERSION"], "Package version mismatch"
              assert archive.read("plugin.wasm")[:8] == b"\x00asm\x01\x00\x00\x00", "Invalid WASM module"
          package.rename(package.with_name(f"echora-navidrome-{os.environ['PLUGIN_VERSION']}.ndp"))
          PY
          cd dist
          sha256sum "echora-navidrome-${PLUGIN_VERSION}.ndp" > "echora-navidrome-${PLUGIN_VERSION}.ndp.sha256"

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echora-navidrome-${{ steps.version.outputs.version }}
          path: |
            plugins/navidrome/dist/echora-navidrome-${{ steps.version.outputs.version }}.ndp
            plugins/navidrome/dist/echora-navidrome-${{ steps.version.outputs.version }}.ndp.sha256
          if-no-files-found: error

      - name: Commit and tag the built plugin version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/navidrome/manifest.json
          git commit -m "chore(plugin-release): ${TAG}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push --atomic origin HEAD:main "$TAG"

      - name: Attach artifacts and publish plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" --verify-tag --draft --latest=false --generate-notes \
            --title "Echora Navidrome plugin ${PLUGIN_VERSION}" \
            "plugins/navidrome/dist/echora-navidrome-${PLUGIN_VERSION}.ndp" \
            "plugins/navidrome/dist/echora-navidrome-${PLUGIN_VERSION}.ndp.sha256"
          gh release edit "$TAG" --draft=false --latest=false
