minimum_pre_commit_version: '4.0.0'
exclude: '^services/analysis/src/echora_analysis/vendor/'
# pre-commit preserves unstaged edits while formatting the staged version.
repos:
  - repo: local
    hooks:
      - id: prettier-typescript
        name: Format TypeScript with Prettier
        entry: node_modules/.bin/prettier --write
        language: system
        types_or: [ts, tsx]
        exclude: '(^|/)(next-env\.d\.ts|dist/|build/|node_modules/|\.next/)'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-format
        args: [--config, services/analysis/pyproject.toml]
