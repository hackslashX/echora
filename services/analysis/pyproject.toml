[project]
name = "echora-analysis"
version = "0.1.0"
description = "Reproducible music embedding and evaluation worker"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "Authlib==1.7.2",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "huggingface-hub==1.28.0",
  "igraph==1.0.0",
  "itsdangerous==2.2.0",
  "muq==0.1.0",
  "numpy==2.5.2",
  "psycopg[binary]==3.3.4",
  "pyyaml==6.0.3",
  "scikit-learn==1.9.0",
  "sentence-transformers==6.0.0",
  "SQLAlchemy==2.0.52",
  "torch==2.13.0",
  "transformers==5.15.1",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echora_analysis"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
