# Single browser entry point for the Echora compose stack.
#
#   /api/*  -> analysis (FastAPI) directly: media requests (cover art, audio
#              streams) and API calls never pass through Node, so artwork
#              grids are limited by Navidrome and the network, not by the
#              Next.js proxy.
#   /*      -> web (Next.js)
#
# Reverse-proxy deployments replicate exactly this shape in front of the
# stack (route the API path at analysis, everything else at web), and the
# app needs no rebuild: ECHORA_MEDIA_BASE tells the client which prefix to use.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # Covers and streams benefit from keepalive to the upstreams.
    upstream web { server web:3000; keepalive 16; }
    upstream analysis { server analysis:8000; keepalive 32; }

    # Generous for large cover art and audio range responses.
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Bounded recording uploads go straight to FastAPI, without Node buffering.
        location /analysis/library/recording/ {
            client_max_body_size 8m;
            client_body_timeout 30s;
            proxy_request_buffering off;
            proxy_pass http://analysis/library/recording/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://analysis/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Audio element issues range requests while streaming.
            proxy_set_header Range $http_range;
            proxy_pass_request_headers on;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
